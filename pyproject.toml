[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ai-commit"
version = "1.0.0"
description = "AI-powered Git commit generator and auto-sync tool using Google Gemini"
readme = "README.md"
authors = [
    { name = "mr-ceo7" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["git", "ai", "commit", "gemini", "automation", "gh-extension", "git-tool"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities"
]
dependencies = [
    "google-generativeai>=0.3.0",
    "python-dotenv>=0.19.0",
    "rich>=12.0.0",
    "inquirer>=3.0.0"
]

[project.scripts]
git-ai-commit = "git_ai_commit.cli:main"
gh-ai-commit = "git_ai_commit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_ai_commit*"]
