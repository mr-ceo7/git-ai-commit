<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="gitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f18" />
      <stop offset="50%" stop-color="#141926" />
      <stop offset="100%" stop-color="#090c14" />
    </linearGradient>
    <linearGradient id="gitCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="gitTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05032" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="gitGlowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05032" stop-opacity="0" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadowGit" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#gitBg)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Grid texture -->
  <g opacity="0.07" stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Top accent glow -->
  <line x1="100" y1="2" x2="1100" y2="2" stroke="url(#gitGlowLine)" stroke-width="3" />

  <!-- Title & Branding -->
  <g transform="translate(60, 75)">
    <!-- Icon -->
    <rect width="44" height="44" rx="10" fill="#431407" stroke="#f05032" stroke-width="2" />
    <circle cx="16" cy="16" r="4" fill="#fb923c" />
    <circle cx="16" cy="28" r="4" fill="#fb923c" />
    <circle cx="28" cy="22" r="4" fill="#38bdf8" />
    <line x1="16" y1="16" x2="16" y2="28" stroke="#fb923c" stroke-width="2" />
    <path d="M16 22C20 22 24 22 28 22" stroke="#38bdf8" stroke-width="2" />

    <!-- Text -->
    <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#gitTextGrad)" letter-spacing="-0.5">git-ai-commit</text>
    <text x="315" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">v1.0.0</text>
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Smart, AI-powered Git commit generator &amp; auto-push tool powered by Google Gemini.</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 175)">
    <!-- Badge 1: Conventional Commits -->
    <rect width="185" height="32" rx="16" fill="#431407" fill-opacity="0.6" stroke="#f05032" stroke-width="1.5" />
    <text x="92" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle">📝 Conventional Commits</text>

    <!-- Badge 2: Google Gemini -->
    <g transform="translate(197, 0)">
      <rect width="165" height="32" rx="16" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
      <text x="82" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">✦ Google Gemini AI</text>
    </g>

    <!-- Badge 3: Git & GH Extension -->
    <g transform="translate(374, 0)">
      <rect width="185" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.5" />
      <text x="92" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">🔌 Git &amp; GH Extension</text>
    </g>

    <!-- Badge 4: Interactive Mode -->
    <g transform="translate(571, 0)">
      <rect width="160" height="32" rx="16" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
      <text x="80" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">⚡ Auto-Commit &amp; Push</text>
    </g>
  </g>

  <!-- Interactive Terminal Card -->
  <g transform="translate(60, 230)" filter="url(#shadowGit)">
    <rect width="1080" height="150" rx="12" fill="url(#gitCard)" stroke="#334155" stroke-width="1.5" />
    
    <circle cx="24" cy="20" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5.5" fill="#10b981" />
    <text x="95" y="24" font-family="'Fira Code', monospace" font-size="12" fill="#64748b">git ai-commit — automated diff-to-commit generation</text>

    <!-- Flow Node 1: Unstaged / Staged Diffs -->
    <g transform="translate(30, 48)">
      <rect width="280" height="80" rx="8" fill="#0b0f19" stroke="#94a3b8" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#f1f5f9">$ git ai-commit</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8">Scanning git status...</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">3 modified files staged</text>
    </g>

    <!-- Arrow 1: Gemini Intelligence -->
    <g transform="translate(325, 78)">
      <line x1="0" y1="10" x2="80" y2="10" stroke="#f05032" stroke-width="2" />
      <polygon points="80,6 90,10 80,14" fill="#f05032" />
      <text x="45" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fb923c" text-anchor="middle">GEMINI AI</text>
      <text x="45" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">DIFF ANALYSIS</text>
    </g>

    <!-- Flow Node 2: Generated Commit Message -->
    <g transform="translate(430, 48)">
      <rect width="360" height="80" rx="8" fill="#0b0f19" stroke="#f05032" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#f05032">Generated Commit Message:</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#34d399">feat(auth): add token auto-rotation</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">Detailed multiline description generated</text>
    </g>

    <!-- Arrow 2: Push -->
    <g transform="translate(805, 78)">
      <line x1="0" y1="10" x2="50" y2="10" stroke="#10b981" stroke-width="2" />
      <polygon points="50,6 60,10 50,14" fill="#10b981" />
    </g>

    <!-- Flow Node 3: Remote Push -->
    <g transform="translate(875, 48)">
      <rect width="175" height="80" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#10b981">Git Remote</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">origin/main</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#34d399">✓ Pushed</text>
    </g>
  </g>
</svg>
